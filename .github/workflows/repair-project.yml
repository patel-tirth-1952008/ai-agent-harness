name: Repair Generated Project

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string
      attempt:
        required: true
        default: "2"
        type: string
      error_logs:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repair agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ATTEMPT: ${{ inputs.attempt }}
          ERROR_LOGS: ${{ inputs.error_logs }}
          LITELLM_DROP_PARAMS: "true"
        run: |
          python repair_agent.py

      - name: Re-run verify
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run verify-project.yml \
            -f target_repo='${{ inputs.target_repo }}' \
            -f attempt='${{ inputs.attempt }}'