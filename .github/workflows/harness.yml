name: AI Agent Harness 24/7 Runner

on:
  schedule:
    # 1. LeetCode Solver: every day at 02:00 UTC
    - cron: '0 2 * * *'

    # 2. Freelance Finder: every day at 08:00 UTC
    - cron: '0 8 * * *'

    # 3. Job Finder: every day at 09:00 UTC
    - cron: '0 9 * * *'

    # 4. Portfolio Builder: every 3 days at 03:00 UTC
    - cron: '0 3 */3 * *'

  # Manual run from GitHub UI
  workflow_dispatch:
    inputs:
      agent_to_run:
        description: 'Choose agent to test manually'
        required: true
        default: 'leetcode'
        type: choice
        options:
          - leetcode
          - portfolio
          - freelance
          - jobs
          - all

permissions:
  contents: write   # commit data/*.json history updates
  actions: write    # allow triggering verify/repair workflows

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Determine Which Agent to Run
        id: select_agent
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TARGET_AGENT=${{ inputs.agent_to_run }}" >> $GITHUB_ENV
          else
            CRON_SCHEDULE="${{ github.event.schedule }}"
            if [ "$CRON_SCHEDULE" == "0 2 * * *" ]; then
              echo "TARGET_AGENT=leetcode" >> $GITHUB_ENV
            elif [ "$CRON_SCHEDULE" == "0 8 * * *" ]; then
              echo "TARGET_AGENT=freelance" >> $GITHUB_ENV
            elif [ "$CRON_SCHEDULE" == "0 9 * * *" ]; then
              echo "TARGET_AGENT=jobs" >> $GITHUB_ENV
            elif [ "$CRON_SCHEDULE" == "0 3 */3 * *" ]; then
              echo "TARGET_AGENT=portfolio" >> $GITHUB_ENV
            else
              echo "TARGET_AGENT=leetcode" >> $GITHUB_ENV
            fi
          fi

      - name: 5. Execute Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_SKILLS: ${{ secrets.YOUR_SKILLS }}
          YOUR_EXPERIENCE_YEARS: ${{ secrets.YOUR_EXPERIENCE_YEARS }}
          YOUR_RESUME_SUMMARY: ${{ secrets.YOUR_RESUME_SUMMARY }}
          LITELLM_DROP_PARAMS: "true"
        run: |
          python run_once.py ${{ env.TARGET_AGENT }}

      - name: 6. Commit Updated Queue & History Files Back to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update data history [skip ci]" && git push)

      - name: 7. Trigger Level-2 Verify (Portfolio only)
        if: env.TARGET_AGENT == 'portfolio' || env.TARGET_AGENT == 'all'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Reads latest built project slug from portfolio history if present
          if [ -f data/portfolio_history.json ]; then
            REPO_NAME=$(python - <<'PY'
          import json
          try:
              d=json.load(open("data/portfolio_history.json"))
              built=d.get("built_projects") or []
              print(built[-1] if built else "")
          except Exception:
              print("")
          PY
            )
          else
            REPO_NAME=""
          fi

          if [ -n "$REPO_NAME" ]; then
            echo "Triggering verify-project for: $REPO_NAME"
            gh workflow run verify-project.yml \
              -f target_repo="$REPO_NAME" \
              -f attempt=1 || echo "verify-project workflow not found yet (add it next)"
          else
            echo "No portfolio project slug found to verify."
          fi