name: Repair Until Green

on:
  workflow_dispatch:
    inputs:
      target_repo:
        required: true
        type: string
      attempt:
        required: true
        type: string
      error_logs:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repair (silent)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          TARGET_REPO: ${{ inputs.target_repo }}
          ATTEMPT: ${{ inputs.attempt }}
          ERROR_LOGS: ${{ inputs.error_logs }}
          LITELLM_DROP_PARAMS: "true"
        run: python repair_agent.py

      - name: Re-verify (silent)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run verify-until-green.yml \
            -f target_repo='${{ inputs.target_repo }}' \
            -f attempt='${{ inputs.attempt }}'